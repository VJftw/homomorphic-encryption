syntax = "proto3";

package api.homomorphic_encryption.v1;

import "google/api/annotations.proto";
import "google/protobuf/any.proto";

option go_package = "github.com/vjftw/homomorphic-encryption/api/homomorphic_encryption/v1";

// message Foo {
// //   bar.Bar x = 1;
//   google.protobuf.Any y = 2;
// };

service ComputeService {
  rpc Compute(ComputeRequest) returns (ComputeResponse) {
    option (google.api.http) = {
      post: "/v1/example/echo"
      body: "*"
    };
  }
}

message ComputeRequest {
  map<string, string> public_scope = 1;
  repeated string steps = 2;
}

message ComputeResponse {
  ComputeRequest compute_request = 1;

  map<string, string> public_scope = 2;
}
